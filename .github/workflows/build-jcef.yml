name: Build JCEF

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated master build as a GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.architecture }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
            architecture: x86_64
            runner_architecture: x86_64
            java_architecture: x64
            python_architecture: x64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
            architecture: arm64
            runner_architecture: aarch64
            java_architecture: aarch64
            python_architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python 3.12.10
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.python_architecture }}
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          architecture: ${{ matrix.java_architecture }}
      - name: Assert runner architecture
        run: |
          actual_architecture="$(uname -m)"
          if [ "$actual_architecture" != '${{ matrix.runner_architecture }}' ]; then
            echo "Expected ${{ matrix.runner_architecture }} runner, found $actual_architecture" >&2
            exit 1
          fi
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ant build-essential cmake libgtk-3-dev ninja-build xauth xvfb
      - name: Verify toolchain and generated JNI headers
        run: |
          source tools/distrib/java17_check.sh
          require_java17 java javac jar javadoc
          java -version
          javac -version
          ant -version
          python3 tools/make_jni_headers.py --verify
      - name: Compile Java and JUnit tests
        run: tools/compile.sh '${{ matrix.target }}'
      - name: Configure and build native artifacts
        env:
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          cmake -S . -B jcef_build -G Ninja -DPROJECT_ARCH='${{ matrix.architecture }}' -DCMAKE_BUILD_TYPE=Release
          cmake --build jcef_build --parallel 4
      - name: Build and run native unit tests
        run: |
          cmake --build jcef_build --config Release --target mouse_wheel_platform_util_test permission_util_test --parallel 4
          ctest --test-dir jcef_build --build-config Release --output-on-failure
      - name: Run deterministic tooling tests
        run: python3 -m unittest discover -s tools/distrib/tests -p 'test_*.py' -v
      - name: Run native-independent JUnit suite
        timeout-minutes: 15
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' tools/run_tests.sh '${{ matrix.target }}' Release --headless --select-package tests.junittests --exclude-tag native-cef
      - name: Run windowless/native JUnit suite
        timeout-minutes: 15
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' tools/run_tests.sh '${{ matrix.target }}' Release --select-package tests.junittests --include-tag native-cef --exclude-tag windowed-cef
      - name: Run windowed JUnit suite
        timeout-minutes: 15
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' tools/run_tests.sh '${{ matrix.target }}' Release --select-package tests.junittests --include-tag windowed-cef --config=jcef.windowless_rendering_enabled=false
      - name: Package validated distribution
        run: |
          tools/make_distrib.sh '${{ matrix.target }}'
          cd binary_distrib
          sha256sum --check '${{ matrix.target }}.tar.gz.sha256'
      - name: Publish tar.gz workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: binary_distrib/${{ matrix.target }}.tar.gz
          archive: false
          if-no-files-found: error
      - name: Publish SHA-256 workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: binary_distrib/${{ matrix.target }}.tar.gz.sha256
          archive: false
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.architecture }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows_amd64
            architecture: x86_64
            runner_architecture: AMD64
            msvc_architecture: x64
            java_distribution: microsoft
            java_version: '17'
            java_architecture: x64
            python_architecture: x64
          - runner: windows-11-arm
            target: windows_arm64
            architecture: arm64
            runner_architecture: ARM64
            msvc_architecture: arm64
            # Microsoft OpenJDK 17.0.19 raises RPC_E_SERVER_DIED_DNE from HotSpot VM Exit on
            # Windows ARM64 after AWT/CEF teardown, even after all AWT threads have terminated.
            java_distribution: zulu
            java_version: '17.0.20+8'
            java_architecture: aarch64
            python_architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python 3.12.10
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.python_architecture }}
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: ${{ matrix.java_distribution }}
          java-version: ${{ matrix.java_version }}
          architecture: ${{ matrix.java_architecture }}
      - name: Assert runner architecture
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne '${{ matrix.runner_architecture }}') {
            throw "Expected ${{ matrix.runner_architecture }} runner, found $env:PROCESSOR_ARCHITECTURE"
          }
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc_architecture }}
          vsversion: '2022'
      - name: Set up Apache Ant 1.10.17
        shell: pwsh
        run: |
          $antVersion = '1.10.17'
          $antArchive = Join-Path $env:RUNNER_TEMP "apache-ant-$antVersion-bin.zip"
          $antRoot = Join-Path $env:RUNNER_TEMP 'apache-ant'
          $expectedHash = '5205a3c87902dd356a6bfcfc5d07659361d1c74627716662d7b31ab47817388dd1d985cfc27ca81a607827cb58d9e36d2d2fbf87a961a5dd4eeabfbde380aa71'
          $downloadUris = @(
            "https://downloads.apache.org/ant/binaries/apache-ant-$antVersion-bin.zip",
            "https://archive.apache.org/dist/ant/binaries/apache-ant-$antVersion-bin.zip"
          )
          $downloadFailures = [System.Collections.Generic.List[string]]::new()
          $downloaded = $false
          for ($attempt = 1; $attempt -le 3 -and -not $downloaded; $attempt++) {
            foreach ($downloadUri in $downloadUris) {
              try {
                Invoke-WebRequest -Uri $downloadUri -OutFile $antArchive -TimeoutSec 120
                $actualHash = (Get-FileHash -Algorithm SHA512 -Path $antArchive).Hash.ToLowerInvariant()
                if ($actualHash -ne $expectedHash) { throw "Apache Ant archive hash mismatch: $actualHash" }
                $downloaded = $true
                break
              } catch {
                $downloadFailures.Add("Attempt $attempt from $downloadUri failed: $($_.Exception.Message)")
                Remove-Item -Path $antArchive -Force -ErrorAction SilentlyContinue
              }
            }
            if (-not $downloaded -and $attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $downloaded) { throw "Unable to download a verified Apache Ant archive:`n$($downloadFailures -join "`n")" }
          Expand-Archive -Path $antArchive -DestinationPath $antRoot
          $antHome = Join-Path $antRoot "apache-ant-$antVersion"
          "ANT_HOME=$antHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$antHome\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify toolchain and generated JNI headers
        shell: cmd
        run: |
          call tools\distrib\java17_check.bat java javac jar javadoc
          java -version
          javac -version
          call ant -version
          python tools/make_jni_headers.py --verify
      - name: Compile Java and JUnit tests
        shell: cmd
        run: tools\compile.bat ${{ matrix.target }}
      - name: Configure and build native artifacts
        shell: pwsh
        env:
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          cmake -S . -B jcef_build -G Ninja -DPROJECT_ARCH='${{ matrix.architecture }}' -DCMAKE_BUILD_TYPE=Release
          cmake --build jcef_build --parallel 4
      - name: Build and run native unit tests
        shell: pwsh
        run: |
          cmake --build jcef_build --config Release --target mouse_wheel_platform_util_test permission_util_test --parallel 4
          ctest --test-dir jcef_build --build-config Release --output-on-failure
      - name: Run deterministic tooling tests
        shell: pwsh
        run: python -m unittest discover -s tools/distrib/tests -p 'test_*.py' -v
      - name: Run native-independent JUnit suite
        timeout-minutes: 15
        shell: cmd
        run: tools\run_tests.bat ${{ matrix.target }} Release --headless --select-package tests.junittests --exclude-tag native-cef
      - name: Run windowless/native JUnit suite
        timeout-minutes: 15
        shell: cmd
        run: tools\run_tests.bat ${{ matrix.target }} Release --select-package tests.junittests --include-tag native-cef --exclude-tag windowed-cef
      - name: Run windowed JUnit suite
        timeout-minutes: 15
        shell: cmd
        run: tools\run_tests.bat ${{ matrix.target }} Release --select-package tests.junittests --include-tag windowed-cef "--config=jcef.windowless_rendering_enabled=false"
      - name: Upload JVM crash reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-crash-${{ matrix.target }}
          path: |
            hs_err_pid*.log
            **/hs_err_pid*.log
          if-no-files-found: ignore
      - name: Package validated distribution
        shell: pwsh
        run: |
          & .\tools\make_distrib.bat '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = 'binary_distrib\${{ matrix.target }}.tar.gz'
          $checksumPath = "$archive.sha256"
          $expectedHash = ((Get-Content -Raw $checksumPath).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Distribution hash mismatch: $actualHash" }
      - name: Publish tar.gz workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: binary_distrib/${{ matrix.target }}.tar.gz
          archive: false
          if-no-files-found: error
      - name: Publish SHA-256 workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: binary_distrib/${{ matrix.target }}.tar.gz.sha256
          archive: false
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.architecture }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: macos_amd64
            architecture: x86_64
            runner_architecture: x86_64
            java_architecture: x64
            python_architecture: x64
          - runner: macos-15
            target: macos_arm64
            architecture: arm64
            runner_architecture: arm64
            java_architecture: aarch64
            python_architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python 3.12.10
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.python_architecture }}
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          architecture: ${{ matrix.java_architecture }}
      - name: Assert runner architecture
        run: |
          actual_architecture="$(uname -m)"
          if [ "$actual_architecture" != '${{ matrix.runner_architecture }}' ]; then
            echo "Expected ${{ matrix.runner_architecture }} runner, found $actual_architecture" >&2
            exit 1
          fi
      - name: Install build dependencies
        run: brew install ant ninja
      - name: Verify toolchain and generated JNI headers
        run: |
          source tools/distrib/java17_check.sh
          require_java17 java javac jar javadoc
          java -version
          javac -version
          ant -version
          python3 tools/make_jni_headers.py --verify
      - name: Compile Java and JUnit tests
        run: tools/compile.sh '${{ matrix.target }}'
      - name: Configure and build native artifacts
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          cmake -S . -B jcef_build -G Ninja -DPROJECT_ARCH='${{ matrix.architecture }}' -DCMAKE_BUILD_TYPE=Release
          cmake --build jcef_build --parallel 4
      - name: Build and run native unit tests
        run: |
          cmake --build jcef_build --config Release --target mouse_wheel_platform_util_test permission_util_test --parallel 4
          ctest --test-dir jcef_build --build-config Release --output-on-failure
      - name: Run deterministic tooling tests
        run: python3 -m unittest discover -s tools/distrib/tests -p 'test_*.py' -v
      - name: Run native-independent JUnit suite without AppKit first-thread mode
        timeout-minutes: 15
        run: tools/run_tests.sh '${{ matrix.target }}' Release --headless --select-package tests.junittests --exclude-tag native-cef
      - name: Run windowless/native JUnit suite
        timeout-minutes: 15
        run: tools/run_tests.sh '${{ matrix.target }}' Release --select-package tests.junittests --include-tag native-cef --exclude-tag windowed-cef
      - name: Run windowed JUnit suite
        timeout-minutes: 15
        run: tools/run_tests.sh '${{ matrix.target }}' Release --select-package tests.junittests --include-tag windowed-cef --config=jcef.windowless_rendering_enabled=false
      - name: Package validated distribution
        run: |
          tools/make_distrib.sh '${{ matrix.target }}'
          cd binary_distrib
          shasum -a 256 -c '${{ matrix.target }}.tar.gz.sha256'
      - name: Publish tar.gz workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: binary_distrib/${{ matrix.target }}.tar.gz
          archive: false
          if-no-files-found: error
      - name: Publish SHA-256 workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: binary_distrib/${{ matrix.target }}.tar.gz.sha256
          archive: false
          if-no-files-found: error

  publish:
    name: Publish validated distributions
    needs: [linux, windows, macos]
    if: >-
      success() &&
      github.repository == 'Keksuccino/jcef-mcef' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: publish-jcef-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*_*.tar.gz*'
          path: release-artifacts
          merge-multiple: true
      - name: Publish commit build as a GitHub Release
        env:
          PUBLICATION_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/distrib/publish_distributions.sh "$PUBLICATION_SHA" release-artifacts
