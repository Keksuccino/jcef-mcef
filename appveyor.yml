# AppVeyor provides an independent Windows x86_64 build. Windows ARM64 is
# covered by the native windows-11-arm GitHub-hosted runner.

image: Visual Studio 2022

clone_folder: c:\projects\java-cef\src

platform: x64
configuration: Release

environment:
  target: windows_amd64
  JAVA_HOME: C:\Program Files\Java\jdk17

install:
  - choco install ant --version=1.10.17 --no-progress --yes
  - set PATH=%JAVA_HOME%\bin;%PATH%
  - java -version
  - javac -version
  - ant -version
  - call tools\distrib\java17_check.bat java javac
  - python tools\make_jni_headers.py --verify

before_build:
  - if /I not "%PROCESSOR_ARCHITECTURE%" == "AMD64" (echo Expected AMD64 runner, found %PROCESSOR_ARCHITECTURE% & exit /B 1)
  - cmake -S . -B jcef_build -G "Visual Studio 17 2022" -A x64 -DPROJECT_ARCH=x86_64
  - call tools\compile.bat %target%

build_script:
  - cmake --build jcef_build --config Release --parallel

test_script:
  - python -m unittest discover -s tools/distrib/tests -p "test_*.py" -v
  - call tools\run_tests.bat %target% Release --headless --select-package tests.junittests --exclude-tag native-cef
  - call tools\run_tests.bat %target% Release --select-package tests.junittests --include-tag native-cef

after_test:
  - call tools\make_distrib.bat %target%
  - ps: |
      $archive = 'binary_distrib\windows_amd64.tar.gz'
      $checksumPath = "$archive.sha256"
      $expectedHash = ((Get-Content -Raw $checksumPath).Trim() -split '\s+')[0]
      $actualHash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
      if ($actualHash -ne $expectedHash) { throw "Distribution hash mismatch: $actualHash" }

artifacts:
  - path: binary_distrib\windows_amd64.tar.gz
    name: windows_amd64.tar.gz
  - path: binary_distrib\windows_amd64.tar.gz.sha256
    name: windows_amd64.tar.gz.sha256
